<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ThoughtBursts</title>
  <style>
    :root {
      --bg-overlay: rgba(15, 23, 42, 0.45);
      --card-bg: rgba(255, 255, 255, 0.18);
      --card-border: rgba(255, 255, 255, 0.3);
      --card-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.75);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background-color: #0f172a;
    }

    /* Wallpaper Layers with full cover sizing */
    .bg-layer {
      position: absolute;
      inset: -10px; 
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      transition: opacity 1.2s ease-in-out, filter 1.2s ease-in-out, transform 1.2s ease-in-out;
      opacity: 0;
      z-index: 1;
      will-change: opacity, filter, transform;
    }
    .bg-layer.active { opacity: 1; }

    /* Dynamic Aesthetic Filter Styles */
    .filter-none { filter: none; transform: scaleX(1); }
    .filter-cinematic { filter: contrast(115%) saturate(110%) hue-rotate(-10deg) brightness(95%); transform: scaleX(1); }
    .filter-sepia-warm { filter: sepia(35%) contrast(105%) brightness(105%) saturate(120%); transform: scaleX(1); }
    .filter-noir { filter: grayscale(100%) contrast(130%) brightness(90%); transform: scaleX(1); }
    .filter-emerald { filter: saturate(125%) hue-rotate(35deg) contrast(110%) brightness(95%); transform: scaleX(1); }
    .filter-sunset { filter: saturate(140%) sepia(20%) hue-rotate(-20deg) contrast(105%); transform: scaleX(1); }
    .filter-reversed { filter: none; transform: scaleX(-1); }
    .filter-cinematic-reversed { filter: contrast(115%) saturate(110%) hue-rotate(-10deg) brightness(95%); transform: scaleX(-1); }

    .overlay-tint {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.65) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* Full-Screen Border Unwinding Progress Animation Layer */
    #fullscreenBorderCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 20;
    }

    /* Fixed App Header */
    .app-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: clamp(14px, 3vw, 24px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .logo {
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      font-weight: 700;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }

    /* Main Content Container */
    .main-container {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Default Creation Button */
    .add-burst-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fff;
      font-size: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--card-shadow);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .add-burst-btn:active { transform: scale(0.9); }

    /* Note Card & Inner Elements */
    .burst-card {
      width: 100%;
      max-width: 520px;
      max-height: calc(100vh - 60px);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: clamp(18px, 4vw, 26px);
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: popIn 0.3s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .burst-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 12px;
    }
    .burst-date {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }

    /* Timer Controls Styling */
    .timer-control-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.2);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .timer-input {
      width: 36px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: right;
      outline: none;
    }
    .timer-select {
      background: transparent;
      border: none;
      color: #fca5a5;
      font-size: 0.85rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }
    .timer-select option {
      background: #0f172a;
      color: #fff;
    }
    .timer-display {
      font-size: 0.85rem;
      color: #fca5a5;
      font-weight: 700;
      margin-left: 6px;
    }

    .burst-editor {
      width: 100%;
      flex: 1;
      min-height: 140px;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1.05rem;
      line-height: 1.5;
      resize: none;
      user-select: text;
      font-family: inherit;
    }
    .burst-editor::placeholder { color: var(--text-muted); }
    .burst-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-danger {
      background: rgba(239, 68, 68, 0.25);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Destruction Physics Canvas Overlay */
    #physicsCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 15;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Wallpaper Layers -->
  <div id="bg1" class="bg-layer active filter-none"></div>
  <div id="bg2" class="bg-layer filter-none"></div>
  <div class="overlay-tint"></div>

  <!-- Full-Screen Border Unwinding Animation Canvas -->
  <canvas id="fullscreenBorderCanvas"></canvas>

  <!-- Header -->
  <header class="app-header">
    <div class="logo">ThoughtBursts</div>
  </header>

  <!-- Interactive Area -->
  <main class="main-container">
    <button id="addBurstBtn" class="add-burst-btn">+</button>

    <div id="burstCard" class="burst-card hidden">
      <div class="burst-header" id="headerFragment">
        <div id="burstTitle" class="burst-date"></div>
      </div>
      
      <!-- Timer Configuration Bar -->
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="timer-control-box">
          <span style="font-size: 0.8rem; color: var(--text-muted);">Destruct in:</span>
          <input type="number" id="timerVal" class="timer-input" value="10" min="1" max="999">
          <select id="timerUnit" class="timer-select">
            <option value="seconds">Sec</option>
            <option value="minutes">Min</option>
            <option value="hours">Hours</option>
          </select>
        </div>
        <div id="timerDisplay" class="timer-display">--:--</div>
      </div>

      <textarea id="burstText" class="burst-editor" placeholder="Write your ephemeral thought..."></textarea>
      
      <div class="burst-footer" id="footerFragment">
        <button id="destroyBtn" class="btn-danger">Destroy Now</button>
      </div>
    </div>
  </main>

      'filter-none', 'filter-cinematic', 'filter-sepia-warm',

    function resizeCanvases() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.scale(dpr, dpr);

      borderCanvas.width = window.innerWidth * dpr;
      borderCanvas.height = window.innerHeight * dpr;
      borderCtx.scale(dpr, dpr);

      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      borderCanvas.style.width = window.innerWidth + 'px';
      borderCanvas.style.height = window.innerHeight + 'px';
    }
    window.addEventListener('resize', resizeCanvases);
    resizeCanvases();

    function safeRoundRect(ctx, x, y, w, h, r) {
      if (typeof ctx.roundRect === 'function') {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.fillRect(x, y, w, h);
        ctx.strokeRect(x, y, w, h);
      }
    }

    // --- Wallpaper Selection from 10,000 Pool ---
    function selectRandomWallpaper() {
      const randomIndex = Math.floor(Math.random() * WALLPAPER_POOL.length);
      const rawUrl = WALLPAPER_POOL[randomIndex];
      return rawUrl.replace(/&sig=[^&]*/, `&sig=rand_${Math.random()}_${Date.now()}`);
    }

    function changeWallpaper() {
      const imageUrl = selectRandomWallpaper();
      const nextLayer = currentBgLayer === 1 ? bg2 : bg1;
      const activeLayer = currentBgLayer === 1 ? bg1 : bg2;

      const chosenFilter = AESTHETIC_FILTER_CLASSES[Math.floor(Math.random() * AESTHETIC_FILTER_CLASSES.length)];

      const img = new Image();
      img.src = imageUrl;
      img.onload = () => {
        nextLayer.className = 'bg-layer ' + chosenFilter;
        nextLayer.style.backgroundImage = `url('${imageUrl}')`;
        
        nextLayer.classList.add('active');
        activeLayer.classList.remove('active');
        currentBgLayer = currentBgLayer === 1 ? 2 : 1;
      };
      img.onerror = () => {
        changeWallpaper();
      };

      scheduleNextWallpaper();
    }

    function scheduleNextWallpaper() {
      if (wpAnimFrame) cancelAnimationFrame(wpAnimFrame);

      const intervals = [8000, 12000, 18000, 25000];
      wpIntervalDuration = intervals[Math.floor(Math.random() * intervals.length)];
      wpStartTime = performance.now();

      function updateAnimations(now) {
        const elapsed = now - wpStartTime;
        const progress = Math.min(elapsed / wpIntervalDuration, 1);
        
        borderCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        
        const w = window.innerWidth;
        const h = window.innerHeight;
        const insetMargin = 16;
        const actualW = w - (insetMargin * 2);
        const actualH = h - (insetMargin * 2);
        const perimeter = 2 * (actualW + actualH);
        
        const drawnLength = perimeter * (1 - progress);

        borderCtx.save();
        borderCtx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
        borderCtx.lineWidth = 3.5;
        borderCtx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        borderCtx.shadowBlur = 8;
        borderCtx.beginPath();

        let currentDist = 0;
        let startX = insetMargin;
        let startY = insetMargin;
        borderCtx.moveTo(startX, startY);

        const topSeg = actualW;
        if (drawnLength > currentDist) {
          const len = Math.min(drawnLength - currentDist, topSeg);
          borderCtx.lineTo(startX + len, startY);
          currentDist += topSeg;
        }

        if (drawnLength > currentDist) {
          const len = Math.min(drawnLength - currentDist, actualH);
          borderCtx.lineTo(startX + actualW, startY + len);
          currentDist += actualH;
        }

        if (drawnLength > currentDist) {
          const len = Math.min(drawnLength - currentDist, actualW);
          borderCtx.lineTo((startX + actualW) - len, startY + actualH);
          currentDist += actualW;
        }

        if (drawnLength > currentDist) {
          const len = Math.min(drawnLength - currentDist, actualH);
          borderCtx.lineTo(startX, (startY + actualH) - len);
        }

        borderCtx.stroke();
        borderCtx.restore();

        if (progress < 1) {
          wpAnimFrame = requestAnimationFrame(updateAnimations);
        } else {
          borderCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          changeWallpaper();
        }
      }

      wpAnimFrame = requestAnimationFrame(updateAnimations);
    }

    // --- Persistent Clock-Based Timer Engine ---
    function updateTimerCalculation() {
      const burst = JSON.parse(localStorage.getItem(STORAGE_BURST));
      if (!burst) return;

      const now = Date.now();
      const distance = burst.targetTime - now;

      if (distance <= 0) {
        timerDisplay.textContent = "00:00";
        if (clockTimerInterval) clearInterval(clockTimerInterval);
        triggerPhysicalDestruction();
        return;
      }

      const totalSecs = Math.floor(distance / 1000);
      const hrs = Math.floor(totalSecs / 3600);
      const mins = Math.floor((totalSecs % 3600) / 60);
      const secs = totalSecs % 60;

      if (hrs > 0) {
        timerDisplay.textContent = `${hrs}h ${mins}m`;
      } else {
        timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
    }

    function syncTimerStorageSettings() {
      const burst = JSON.parse(localStorage.getItem(STORAGE_BURST));
      if (!burst) return;

      const val = parseInt(timerValInput.value) || 10;
      const unit = timerUnitSelect.value;

      let multiplier = 1000;
      if (unit === 'minutes') multiplier = 60 * 1000;
      if (unit === 'hours') multiplier = 60 * 60 * 1000;

      burst.timerVal = val;
      burst.timerUnit = unit;
      burst.targetTime = Date.now() + (val * multiplier);

      localStorage.setItem(STORAGE_BURST, JSON.stringify(burst));
      updateTimerCalculation();
    }

    // --- Burst Note Engine ---
    function renderBurst(burst) {
      if (clockTimerInterval) clearInterval(clockTimerInterval);

      if (!burst) {
        burstCard.classList.add('hidden');
        addBurstBtn.classList.remove('hidden');
        return;
      }

      addBurstBtn.classList.add('hidden');
      burstCard.classList.remove('hidden');
      burstTitle.textContent = burst.title;
      burstText.value = burst.text || '';
      
      timerValInput.value = burst.timerVal || 10;
      timerUnitSelect.value = burst.timerUnit || 'seconds';

      if (!burst.targetTime) {
        syncTimerStorageSettings();
      } else {
        updateTimerCalculation();
      }

      clockTimerInterval = setInterval(updateTimerCalculation, 1000);
    }

    function createBurst() {
      const now = new Date();
      const formattedDate = now.toLocaleDateString(undefined, {
        month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });

      const val = 10;
      const unit = 'seconds';
      const targetTime = Date.now() + (val * 1000);

      const burst = {
        title: formattedDate,
        text: '',
        timerVal: val,
        timerUnit: unit,
        targetTime: targetTime
      };

      localStorage.setItem(STORAGE_BURST, JSON.stringify(burst));
      renderBurst(burst);
    }

    // --- Physical Physics Gravity Shatter Animation ---
    function triggerPhysicalDestruction() {
      if (isDestroying) return;
      isDestroying = true;
      if (clockTimerInterval) clearInterval(clockTimerInterval);

      const particles = [];
      
      function createDebris(x, y, width, height, drawFn) {
        return {
          x, y, width, height,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.8) * 10 - 2,
          gravity: 0.45 + Math.random() * 0.15,
          rotation: 0,
          vRot: (Math.random() - 0.5) * 0.2,
          opacity: 1,
          fade: 0.005 + Math.random() * 0.005,
          drawFn
        };
      }

      const cardRect = burstCard.getBoundingClientRect();
      const rows = 5;
      const cols = 5;
      const pieceW = cardRect.width / cols;
      const pieceH = cardRect.height / rows;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const px = cardRect.left + (c * pieceW);
          const py = cardRect.top + (r * pieceH);
          
          particles.push(createDebris(px, py, pieceW, pieceH, (ctx, p) => {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            safeRoundRect(ctx, 0, 0, p.width, p.height, 4);
          }));
        }
      }

      burstCard.classList.add('hidden');
      localStorage.removeItem(STORAGE_BURST);

      function animatePhysics() {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        let activeParticles = 0;

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          if (p.opacity <= 0 || p.y > window.innerHeight + 100) continue;

          activeParticles++;
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.rotation += p.vRot;
          p.opacity = Math.max(0, p.opacity - p.fade);

          ctx.save();
          ctx.globalAlpha = p.opacity;
          ctx.translate(p.x + p.width / 2, p.y + p.height / 2);
          ctx.rotate(p.rotation);
          p.drawFn(ctx, p);
          ctx.restore();
        }

        if (activeParticles > 0) {
          requestAnimationFrame(animatePhysics);
        } else {
          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          isDestroying = false;
          renderBurst(null);
        }
      }

      requestAnimationFrame(animatePhysics);
    }

    // --- UI Event Listeners ---
    addBurstBtn.addEventListener('click', () => createBurst());

    burstText.addEventListener('input', (e) => {
      const burst = JSON.parse(localStorage.getItem(STORAGE_BURST));
      if (burst) {
        burst.text = e.target.value;
        localStorage.setItem(STORAGE_BURST, JSON.stringify(burst));
      }
    });

    timerValInput.addEventListener('input', syncTimerStorageSettings);
    timerUnitSelect.addEventListener('change', syncTimerStorageSettings);

    destroyBtn.addEventListener('click', triggerPhysicalDestruction);

    // --- Initialization ---
    (function init() {
      const savedBurst = JSON.parse(localStorage.getItem(STORAGE_BURST));
      if (savedBurst) {
        renderBurst(savedBurst);
      }
      changeWallpaper();
    })();
  </script>
</body>
